[project]
name = "wtm"
version = "0.1.0"
description = "Git worktree manager for a single projects-root layout"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
wtm = "wtm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtm"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]  # typer.Option/Argument defaults are the Typer idiom

[tool.ruff.lint.isort]
known-first-party = ["wtm"]
